<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Flexíveis</title>
</head>
<body>
    <h1>Imagens Flexíveis</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência.</p>
    <picture>
        <source media="(max-width: 350px)" srcset="imagens/paisagem-p.png" type="image/png">
        <source media="(max-width: 750px)" srcset="imagens/paisagem-m.png" type="image/png"><!--Se o imagem M ultrapassa o tamanho máximo de 750px ela não aparece-->
        <img src="imagens/paisagem-g.png" alt="">
    </picture>
</body>
</html>
